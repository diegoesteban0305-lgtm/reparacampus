{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body p-4 text-center">
        <div class="rc-metric text-muted-rc mb-2">{{ codigo }}</div>
        <h1 class="h4">{{ titulo }}</h1>
        <p class="text-muted-rc">{{ mensaje }}</p>
        <a class="btn btn-primary" href="{{ url_for('dashboard') if usuario else url_for('login') }}">
          {% if usuario %}Volver al inicio{% else %}Iniciar sesión{% endif %}
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
